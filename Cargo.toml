[package]
name = "bluetooth-battery-monitor"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"
description = "Bluetooth Battery Monitor"

[[bin]]
name = "BluetoothBatteryMonitor"
path = "src/main.rs"

[dependencies]
ab_glyph = { version = "=0.2.32", default-features = false, features = ["std"] }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow"] }
hidapi = { version = "=2.6.7", default-features = false, features = ["windows-native"] }
raw-window-handle = "=0.6.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
windows = { version = "=0.62.2", features = [
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Storage_Streams",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
screenshot = ["eframe/__screenshot"]

[build-dependencies]
winresource = "=0.1.34"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
